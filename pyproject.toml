[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "univ3-tick-math"
version = "0.1.0"
description = "Uniswap v3 tick, price and sqrtPriceX96 conversions with token decimals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kenny-ish" }]
keywords = ["uniswap", "uniswap-v3", "defi", "ethereum", "amm", "tick"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/kenny-ish/univ3-tick-math"
Changelog = "https://github.com/kenny-ish/univ3-tick-math/blob/main/CHANGELOG.md"

[project.scripts]
univ3-tick = "tickmath:main"

[tool.setuptools]
py-modules = ["tickmath"]
